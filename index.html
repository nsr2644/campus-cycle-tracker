<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIMKashipur Campus Cycle Tracking System</title>
    <!-- Tailwind CSS for Beautiful UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Html5Qrcode Library for Mobile Camera Scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- MD5 Cryptographic Encryption Library to Hide Password -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4 antialiased">

    <!-- Main Application Card -->
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md mt-6 border border-slate-200">
        <div class="flex items-center justify-center gap-2 mb-6">
            <span class="text-3xl">🚲</span>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Campus Cycle Tracker</h1>
        </div>

        <!-- Student Inputs Form -->
        <div class="space-y-4" id="form-section">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Student Full Name</label>
                <input type="text" id="student-name" class="w-full mt-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm transition" placeholder="e.g. Amit Sharma">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Roll Number</label>
                <input type="text" id="student-roll" class="w-full mt-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm transition" placeholder="e.g. MBA26026">
            </div>
            <!-- SECURITY PIN FIELD -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Set 4-Digit Security PIN (Only for Issue)</label>
                <input type="password" id="student-pin" maxlength="4" pattern="\d*" class="w-full mt-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm transition" placeholder="e.g. 1234">
            </div>
            
            <!-- Dynamic Action Buttons -->
            <div class="flex gap-3 pt-2">
                <button onclick="startScanner('ISSUE')" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/20 cursor-pointer">
                    Scan to ISSUE
                </button>
                <button onclick="startScanner('DROP')" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-amber-500/20 cursor-pointer">
                    Scan to DROP
                </button>
            </div>
        </div>

        <!-- Camera Scanner Feed UI -->
        <div id="scanner-section" class="hidden mt-6">
            <div class="bg-blue-50 border border-blue-200 text-blue-800 text-xs font-medium px-2.5 py-1.5 rounded-lg text-center mb-4">
                Scanning Cycle QR Code for: <span id="action-type" class="font-bold underline"></span>
            </div>
            <div id="reader" class="w-full overflow-hidden rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50"></div>
            <button onclick="stopScanner()" class="w-full mt-4 bg-slate-600 hover:bg-slate-700 text-white font-semibold py-2.5 rounded-xl transition text-sm">
                Cancel / Go Back
            </button>
        </div>

        <!-- Dynamic Status Alerts -->
        <div id="msg-box" class="hidden mt-6 p-4 rounded-xl text-center font-medium text-sm transition-all duration-300"></div>
    </div>

    <!-- Admin Panel Security Toggle -->
    <div class="w-full max-w-md mt-4 text-right">
        <button onclick="toggleAdminPanel()" class="text-xs font-bold text-slate-500 hover:text-blue-600 transition cursor-pointer">
            ⚙️ Admin Login
        </button>
    </div>

    <!-- Admin Panel & Reports Logs Section -->
    <div id="admin-panel" class="hidden bg-white p-6 rounded-2xl shadow-xl w-full max-w-md mt-2 border border-slate-200">
        <div class="flex flex-col gap-3 mb-4">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-600">Admin Control Panel</h2>
                <button onclick="clearSystemData()" class="text-xs text-red-500 hover:underline">Reset System Data</button>
            </div>
            
            <!-- SECURED EXCEL EXPORT BUTTON -->
            <button onclick="exportToExcel()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-md transition cursor-pointer">
                📊 Secure Excel Download (.csv)
            </button>
        </div>
    </div>

    <!-- Public Live Dashboard for Everyone -->
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md mt-4 border border-slate-200">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Currently Issued Cycles</h3>
        <div id="log-list" class="space-y-2">
            <!-- Dynamic JavaScript Content Hooks -->
        </div>
    </div>

    <script>
        let html5QrcodeScanner = null;
        let currentAction = ""; 
        
        // 🔒 UPDATED CRYTOGRAPHIC TOKEN FOR PASSWORD "Hostel@#$$742"
        const ADMIN_HASH = "506bf56da5557f564e54b767aa5d785f"; 

        // Database Configuration Setup in LocalStorage
        if (!localStorage.getItem('cycleStandDB')) {
            localStorage.setItem('cycleStandDB', JSON.stringify({}));
        }
        if (!localStorage.getItem('cycleHistoryLogs')) {
            localStorage.setItem('cycleHistoryLogs', JSON.stringify([]));
        }

        function showMessage(text, type) {
            const msgBox = document.getElementById('msg-box');
            msgBox.innerHTML = text;
            msgBox.classList.remove('hidden');
            if (type === 'error') {
                msgBox.className = "mt-6 p-4 rounded-xl text-center font-medium text-sm bg-rose-50 text-rose-700 border border-rose-200 block";
            } else if (type === 'success') {
                msgBox.className = "mt-6 p-4 rounded-xl text-center font-medium text-sm bg-emerald-50 text-emerald-700 border border-emerald-200 block";
            }
        }

        function startScanner(action) {
            const name = document.getElementById('student-name').value.trim();
            const roll = document.getElementById('student-roll').value.trim();
            const pin = document.getElementById('student-pin').value.trim();

            if (!name || !roll) {
                alert("Please enter the student's name and roll number first!");
                return;
            }

            if (action === "ISSUE" && (!pin || pin.length !== 4)) {
                alert("Set any new 4-digit security PIN to issue a cycle!");
                return;
            }

            currentAction = action;
            document.getElementById('action-type').innerText = action;
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('scanner-section').classList.remove('hidden');

            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                { fps: 15, qrbox: { width: 220, height: 220 } },
                onScanSuccess
            ).catch(err => {
                alert("Camera access denied or camera not found!");
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('scanner-section').classList.add('hidden');
                    document.getElementById('form-section').classList.remove('hidden');
                });
            }
        }

        function onScanSuccess(cycleNumber) {
            const inputName = document.getElementById('student-name').value.trim();
            const inputRoll = document.getElementById('student-roll').value.trim();
            const inputPin = document.getElementById('student-pin').value.trim();
            const sanitizedCycleNum = cycleNumber.trim().toUpperCase();
            const currentTime = new Date().toLocaleString('en-IN');

            let db = JSON.parse(localStorage.getItem('cycleStandDB'));
            let history = JSON.parse(localStorage.getItem('cycleHistoryLogs'));
            stopScanner();

            if (currentAction === "ISSUE") {
                if (db[sanitizedCycleNum] && db[sanitizedCycleNum].status === "ISSUED") {
                    var errorMsg = "🚨 <strong>This cycle is already issued!</strong><br>Cycle <b>" + sanitizedCycleNum + "</b> currently has been taken by " + db[sanitizedCycleNum].studentName + " (Roll: " + db[sanitizedCycleNum].studentRoll + ")!";
                    showMessage(errorMsg, 'error');
                } else {
                    db[sanitizedCycleNum] = {
                        status: "ISSUED",
                        studentName: inputName,
                        studentRoll: inputRoll,
                        securityPin: inputPin, 
                        timestamp: currentTime
                    };
                    
                    history.push({
                        Date_Time: currentTime,
                        Action: "ISSUE",
                        Cycle_No: sanitizedCycleNum,
                        Student_Name: inputName,
                        Roll_No: inputRoll,
                        Security_Pin: inputPin
                    });

                    localStorage.setItem('cycleStandDB', JSON.stringify(db));
                    localStorage.setItem('cycleHistoryLogs', JSON.stringify(history));
                    showMessage("🎉 Success! Cycle <b>" + sanitizedCycleNum + "</b> has been assigned to you. Remember your drop pin.", 'success');
                    document.getElementById('student-pin').value = ""; 
                }
            } 
            else if (currentAction === "DROP") {
                if (db[sanitizedCycleNum] && db[sanitizedCycleNum].status === "ISSUED") {
                    
                    const userEnteredPin = prompt("Security Check: Enter your 4-digit security PIN to drop off this cycle:");
                    
                    if (userEnteredPin !== db[sanitizedCycleNum].securityPin) {
                        showMessage("🚨 <strong>Access Denied!</strong> Incorrect security PIN. You cannot drop off another student's cycle.", 'error');
                        updateLogView();
                        return;
                    }

                    const activeUser = db[sanitizedCycleNum].studentName;
                    const activeRoll = db[sanitizedCycleNum].studentRoll;
                    const activePin = db[sanitizedCycleNum].securityPin;

                    history.push({
                        Date_Time: currentTime,
                        Action: "DROP/RETURN",
                        Cycle_No: sanitizedCycleNum,
                        Student_Name: activeUser,
                        Roll_No: activeRoll,
                        Security_Pin: activePin
                    });

                    db[sanitizedCycleNum].status = "AVAILABLE";

                    localStorage.setItem('cycleStandDB', JSON.stringify(db));
                    localStorage.setItem('cycleHistoryLogs', JSON.stringify(history));
                    showMessage("✅ Cycle <b>" + sanitizedCycleNum + "</b> has been safely returned to the stand.", 'success');
                } else {
                    showMessage("❌ Operation Failed: Cycle <b>" + sanitizedCycleNum + "</b> is already available in the cycle stand records.", 'error');
                }
            }

            updateLogView();
        }

        function updateLogView() {
            const db = JSON.parse(localStorage.getItem('cycleStandDB'));
            const container = document.getElementById('log-list');
            container.innerHTML = "";
            
            let activeCount = 0;
            for (let id in db) {
                if (db[id].status === "ISSUED") {
                    activeCount++;
                    container.innerHTML += 
                        '<div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex flex-col gap-1 text-xs">' +
                            '<div class="flex justify-between items-center">' +
                                '<span class="font-bold text-slate-700 bg-slate-200 px-2 py-0.5 rounded text-[10px] tracking-wide">' + id + '</span>' +
                                '<span class="text-slate-400 text-[10px]">' + db[id].timestamp + '</span>' +
                            '</div>' +
                            '<p class="text-slate-600 font-medium"><span class="text-slate-400">Issued to:</span> ' + db[id].studentName + ' (' + db[id].studentRoll + ')</p>' +
                        '</div>';
                }
            }
            if(activeCount === 0) {
                container.innerHTML = "<p class='text-slate-400 text-center py-4 text-xs italic'>All cycles are inside the stand.</p>";
            }
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('admin-panel');
            if (panel.classList.contains('hidden')) {
                const userPassword = prompt("Please enter the admin security password:");
                if (userPassword !== null) {
                    if (md5(userPassword) === ADMIN_HASH) {
                        panel.classList.remove('hidden');
                    } else {
                        alert("Wrong Password! Access Denied.");
                    }
                }
            } else {
                panel.classList.add('hidden');
            }
        }

        function exportToExcel() {
            const verify = prompt("Security Check: Re-enter password:");
            if (verify !== null) {
                if (md5(verify) !== ADMIN_HASH) {
                    alert("Unauthorized Access!");
                    return;
                }
            } else {
                return;
            }

            const history = JSON.parse(localStorage.getItem('cycleHistoryLogs'));
            if (!history || history.length === 0) {
                alert("There is no historical data in the database to download yet!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += "Date & Time,Action,Cycle Number,Student Name,Roll Number,Security PIN\n";

            history.forEach(row => {
                const dt = row.Date_Time || "N/A";
                const act = row.Action || "N/A";
                const cNo = row.Cycle_No || "N/A";
                const sName = row.Student_Name || "N/A";
                const rNo = row.Roll_No || "N/A";
                const pinNum = row.Security_Pin || "N/A";

                csvContent += '"' + dt + '","' + act + '","' + cNo + '","' + sName + '","' + rNo + '","' + pinNum + '"\n';
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Campus_Cycle_Master_Report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearSystemData() {
            const verify = prompt("Enter the admin password to confirm:");
            if (verify !== null) {
                if (md5(verify) === ADMIN_HASH) {
                    if(confirm("Do you really want to permanently delete all tracking and log data?")) {
                        localStorage.setItem('cycleStandDB', JSON.stringify({}));
                        localStorage.setItem('cycleHistoryLogs', JSON.stringify([]));
                        updateLogView();
                        document.getElementById('admin-panel').classList.add('hidden');
                        document.getElementById('msg-box').classList.add('hidden');
                        alert("Database Successfully Cleared!");
                    }
                } else {
                    alert("Wrong Password!");
                }
            }
        }

        updateLogView();
    </script>
</body>
</html>
